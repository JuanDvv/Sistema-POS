name: Release Multiplataforma (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Plataforma a compilar y desplegar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - mac
          - win
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build & Deploy (Windows)
    runs-on: windows-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'win')) ||
      (github.event_name == 'push' && !endsWith(github.ref_name, '-mac'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOF > ~/.ssh/config
          Host 100.100.163.62
            StrictHostKeyChecking accept-new
            BatchMode yes
            IdentityFile ~/.ssh/id_rsa
          EOF

      - name: Execute Build and Deploy
        run: npm run release:win

  build-mac:
    name: Build & Deploy (macOS)
    runs-on: macos-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'mac')) ||
      (github.event_name == 'push' && !endsWith(github.ref_name, '-win'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOF > ~/.ssh/config
          Host 100.100.163.62
            StrictHostKeyChecking accept-new
            BatchMode yes
            IdentityFile ~/.ssh/id_rsa
          EOF

      - name: Execute Build and Deploy
        run: npm run release:mac


