<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>POS Delipostres Turbaco - Traslado de Productos</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            overflow: hidden;
        }

        .main-content {
            flex-grow: 1;
            padding: 25px;
            display: flex;
            gap: 20px;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }

        .transfer-section {
            flex: 2;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .config-section {
            flex: 1.2;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .transfer-list {
            flex: 1;
            overflow-y: auto;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .transfer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .transfer-item-info {
            flex-grow: 1;
            min-width: 0;
            padding-right: 10px;
        }

        .transfer-item-title {
            margin: 0;
            font-size: 0.9em;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-qty {
            background-color: #e5e7eb;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-qty:hover {
            background-color: #d1d5db;
        }

        .btn-submit {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }

        @media (max-width: 1200px) {
            .main-content {
                padding: 15px !important;
                gap: 10px !important;
            }
            .config-section {
                flex: 1.1 !important;
                padding: 12px !important;
            }
            .transfer-section {
                flex: 1 !important;
                padding: 12px !important;
            }
        }

        @media (max-width: 500px) {
            .main-content {
                padding: 15px !important;
                padding-top: 70px !important;
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }

            .transfer-section,
            .config-section {
                flex: none;
                height: auto;
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <button id="menu-toggle" class="menu-toggle-btn">☰</button>
    <nav id="sidebar-container"></nav>
    <main class="main-content">
        <!-- Panel Izquierdo: Selección y catálogo de origen -->
        <div class="transfer-section">
            <div
                style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                <div style="display:flex; align-items:center; gap: 15px;">
                    <h2 style="margin:0; color: #111827; font-size: 1.3rem;">Productos en Origen</h2>
                    <select id="select-sucursal-origen"
                        style="padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-weight: bold; background-color: #f9fafb;"></select>
                </div>
                <input type="text" id="search-productos" placeholder="🔍 Buscar producto..."
                    style="padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; width: 200px; font-family: inherit; font-size: 0.9em; box-sizing: border-box;">
            </div>
            <div class="grid-products" id="grid-products"></div>
        </div>

        <!-- Panel Derecho: Destino y Canasta de envío -->
        <div class="config-section">
            <h3 style="margin-top:0; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; color: #111827;">Canasta de
                Envío</h3>

            <div class="form-group">
                <label for="select-sucursal-destino">Sucursal de Destino</label>
                <select id="select-sucursal-destino"></select>
            </div>

            <div class="transfer-list" id="transfer-list">
                <p style="color: #6b7280; text-align: center; margin-top: 40px;">No has agregado productos a trasladar.
                </p>
            </div>

            <div>
                <button class="btn-submit" id="btn-enviar-transferencia">Registrar Traslado</button>
            </div>
        </div>
    </main>

    <script src="./sidebar.js"></script>
    <script src="./transferencias.js"></script>
</body>

</html>
